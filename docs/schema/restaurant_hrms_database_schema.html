* { box-sizing: border-box; margin: 0; padding: 0; }

.tables-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }

.fields-list { display: none; padding: 6px 0; }

.field-row {

.field-row:last-child { border-bottom: none; }

.field-icon { font-size: 12px; color: var(--color-text-tertiary); width: 16px; flex-shrink: 0; }
.field-name { font-family: var(--font-mono); color: var(--color-text-primary); flex: 1; min-width: 0; }
.field-type { font-size: 11px; color: var(--color-text-secondary); white-space: nowrap; }
.badge {

.badge-pk { background: var(--color-background-warning); color: var(--color-text-warning); }
.badge-fk { background: var(--color-background-info); color: var(--color-text-info); }

const modMap = {};
MODULES.forEach(m => modMap[m.id] = m);

let activeModule = 'all';
let openTables = new Set();

function render() {
  const filtered = activeModule === 'all'
    ? TABLES
    : TABLES.filter(t => t.module === activeModule);

  document.getElementById('tablesGrid').innerHTML = filtered.map(t => {
    const mod = modMap[t.module];
    const isOpen = openTables.has(t.id);
    return `
    <div class="table-card">
      <div class="table-header" onclick="toggleTable('${t.id}')">
        <div class="table-header-left">
          <span class="mod-dot" style="background:${mod.color}"></span>
          <div>
            <div class="table-name">${t.name}</div>
            <div class="table-desc">${t.desc}</div>
          </div>
        </div>
        <span class="row-count">${t.fields.length} cols</span>
        <i class="ti ti-chevron-down chevron${isOpen?' open':''}" aria-hidden="true"></i>
      </div>
      <div class="fields-list${isOpen?' open':''}">
        ${t.fields.map(f => `
          <div class="field-row">
            <span class="field-icon" aria-hidden="true">${fieldIcon(f)}</span>
            <span class="field-name">${f.name}</span>
            <span class="field-type">${f.type}</span>
            ${f.badge ? `<span class="badge badge-${f.badge}">${f.badge.toUpperCase()}</span>` : ''}
          </div>
        `).join('')}
      </div>
    </div>`;
  }).join('');

  // stats
  const total = TABLES.length;
  const cols = TABLES.reduce((s,t)=>s+t.fields.length,0);
  const fks = TABLES.reduce((s,t)=>s+t.fields.filter(f=>f.badge==='fk').length,0);
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">Tables</div></div>
    <div class="stat-card"><div class="stat-num">${cols}</div><div class="stat-label">Total columns</div></div>
    <div class="stat-card"><div class="stat-num">${fks}</div><div class="stat-label">Foreign keys</div></div>
    <div class="stat-card"><div class="stat-num">${MODULES.length}</div><div class="stat-label">Modules</div></div>
  `;

  // nav
  const modsUsed = activeModule;
  document.getElementById('modsNav').innerHTML =
    `<button class="mod-btn${activeModule==='all'?' active':''}" onclick="setModule('all')">All</button>` +
    MODULES.map(m => `<button class="mod-btn${activeModule===m.id?' active':''}" onclick="setModule('${m.id}')" style="${activeModule===m.id?`background:${m.color}20;color:${m.color};border-color:${m.color}40`:''}">${m.label}</button>`).join('');
}

function fieldIcon(f) {
  if(f.badge==='pk') return '<i class="ti ti-key"></i>';
  if(f.badge==='fk') return '<i class="ti ti-link"></i>';
  if(f.type.startsWith('TIMESTAMPTZ')||f.type.startsWith('DATE')||f.type.startsWith('TIME')) return '<i class="ti ti-calendar"></i>';
  if(f.type.startsWith('BOOLEAN')) return '<i class="ti ti-toggle-left"></i>';
  if(f.type.startsWith('NUMERIC')||f.type.startsWith('INT')||f.type.startsWith('SMALLINT')) return '<i class="ti ti-hash"></i>';
  if(f.type.startsWith('ENUM')) return '<i class="ti ti-list"></i>';
  if(f.type.startsWith('JSONB')||f.type.startsWith('TEXT')) return '<i class="ti ti-align-left"></i>';
  return '<i class="ti ti-letter-a"></i>';
}

function toggleTable(id) {
  if(openTables.has(id)) openTables.delete(id);
  else openTables.add(id);
  render();
}
function setModule(m) {
  activeModule = m;
  openTables.clear();
  render();
}
render();
</script>
